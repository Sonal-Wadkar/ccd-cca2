
apiVersion: apps/v1
kind: Deployment

metadata:
  name: little-bloom-cafe
  labels:
    app: little-bloom-cafe

spec:
  replicas: 1

  selector:
    matchLabels:
      app: little-bloom-cafe

  template:
    metadata:
      labels:
        app: little-bloom-cafe

    spec:
      containers:
        - name: little-bloom-cafe
          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/little-bloom-cafe:1
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
